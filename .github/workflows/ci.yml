name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch first, then the project)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve,track,notebooks,dev]"
      - run: ruff check .
      - run: mypy hmrec --ignore-missing-imports
      - run: ruff format --check hmrec tests app notebooks/build_notebooks.py
      - name: Tests (synthetic fixtures only, no Kaggle data needed)
        run: pytest
      - name: End-to-end smoke run of the experiment script on the fixture
        run: python -m hmrec.run --fixture --data-dir /tmp/hmfx --sample-frac 1.0 --encoder tfidf --history-weeks 8 --tt-epochs 2 --threads 2 --out /tmp/out --docs /tmp/docs
      - name: Notebooks execute on the fixture fallback
        run: |
          python -m ipykernel install --user --name hmrec
          python notebooks/build_notebooks.py --execute

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmrec"
version = "0.1.0"
description = "Two-stage (candidate generation + LightGBM ranking) recommender for H&M purchases"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.2",
    "pandas==2.3.2",
    "scipy==1.16.1",
    "scikit-learn==1.7.1",
    "pyarrow==21.0.0",
    "lightgbm==4.7.0",
    "implicit==0.7.3",
    "faiss-cpu==1.15.1",
    "kaggle==2.2.5",
]

[project.optional-dependencies]
deep = ["torch==2.14.1", "sentence-transformers==5.1.1"]
serve = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]
track = ["mlflow==3.17.2"]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.1"]
all = ["hmrec[deep,serve,track,dev]"]

[tool.setuptools]
packages = ["hmrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]
